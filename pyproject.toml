[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secscan2026"
version = "0.1.0"
description = "Static + passive security scanner for 2026-era code, config and dependency flaws. Read-only, no exploits."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Maicon Luis Braga" }]
keywords = ["security", "sast", "secrets", "supabase", "cors", "scanner", "appsec"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
secscan = "secscan.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["secscan"]
